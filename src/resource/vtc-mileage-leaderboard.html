<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>VTC 里程排行榜</title><link rel="stylesheet" href="./package/prime-theme.css"><style>
#container{width:720px;overflow:hidden}.header{padding:30px 32px;display:flex;align-items:center;justify-content:space-between}.title{font-size:38px;margin-top:10px}.summary{margin-top:8px;color:var(--muted);font-size:16px}.logo{width:78px;height:78px;object-fit:contain}.list{padding:20px;display:grid;gap:11px}.item{display:grid;grid-template-columns:72px minmax(0,1fr) 190px;align-items:center;gap:16px;padding:14px 18px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}.item.top{border-color:rgba(244,200,106,.34);background:linear-gradient(115deg,rgba(244,200,106,.12),rgba(128,109,255,.13))}.rank{font-size:27px;font-weight:950;color:var(--prime2)}.top .rank{color:var(--gold)}.name{font-size:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{margin-top:5px;color:var(--muted);font-size:13px}.distance{text-align:right;font-size:23px;font-weight:950}.unit{margin-top:5px;color:var(--muted);font-size:12px}.empty{padding:70px;text-align:center;color:var(--muted);font-size:20px}</style></head><body><div id="container"><div class="header"><div><div class="header-kicker">Prime Logistics</div><div class="title" id="title">VTC 里程排行榜</div><div class="summary" id="summary"></div></div><img class="logo" src="./package/img/logo2.png" alt="Prime Logistics"></div><div class="list" id="list"></div></div><script>
function esc(v){return String(v??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){const km=(Number(v)||0)/1000;return km>=1000?`${(km/1000).toFixed(2)} 万公里`: `${km.toFixed(1)} 公里`}function setData(data){document.getElementById('title').textContent=data.rankingType===2?'VTC 今日里程排行榜':'VTC 总里程排行榜';document.getElementById('summary').textContent=`VTC ${data.vtcId}｜展示前 ${Math.min(10,(data.list||[]).length)} 名`;const list=document.getElementById('list');list.innerHTML='';const items=(data.list||[]).slice(0,10);if(!items.length){list.innerHTML='<div class="empty">暂无排行数据</div>';return}items.forEach(p=>{const el=document.createElement('div');el.className=`item ${Number(p.ranking)<=3?'top':''}`;el.innerHTML=`<div class="rank">#${esc(p.ranking)}</div><div><div class="name">${esc(p.tmpName)}</div><div class="meta">TMP ${esc(p.tmpId)}</div></div><div class="distance">${fmt(p.distance)}<div class="unit">统计里程</div></div>`;list.appendChild(el)})}</script></body></html>
