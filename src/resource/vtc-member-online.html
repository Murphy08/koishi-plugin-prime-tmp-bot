<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>VTC 在线成员</title><link rel="stylesheet" href="./package/prime-theme.css"><style>
body{padding:0}#container{width:720px;overflow:hidden}.header{padding:30px 32px;display:flex;justify-content:space-between;align-items:center}.title{font-size:38px;margin-top:10px}.summary{color:var(--muted);font-size:16px;margin-top:8px}.logo{width:78px;height:78px;object-fit:contain}.list{padding:20px;display:grid;gap:12px}.member{display:grid;grid-template-columns:64px minmax(0,1fr) 210px;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}.state{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:24px;background:rgba(255,255,255,.06)}.member.online .state{background:rgba(66,211,146,.16);color:#55e4a0}.member-name{font-size:24px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.role{margin-top:6px;color:var(--muted);font-size:14px}.server{text-align:right}.server strong{display:block;font-size:18px}.server span{display:block;margin-top:6px;color:var(--muted);font-size:13px}.empty{padding:70px 20px;text-align:center;color:var(--muted);font-size:20px}</style></head><body><div id="container"><div class="header"><div><div class="header-kicker">Prime Logistics</div><div class="title">VTC 在线成员</div><div class="summary" id="summary">正在读取成员状态</div></div><img class="logo" src="./package/img/logo2.png" alt="Prime Logistics"></div><div class="list" id="list"></div></div><script>
function esc(v){return String(v??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setData(data){const list=document.getElementById('list');const members=Array.isArray(data.members)?data.members:[];document.getElementById('summary').textContent=`VTC ${data.vtcId}｜在线 ${members.length} 人`;list.innerHTML='';if(!members.length){list.innerHTML='<div class="empty">当前没有在线成员</div>';return}members.forEach(m=>{const el=document.createElement('div');el.className='member online';el.innerHTML=`<div class="state">●</div><div><div class="member-name">${esc(m.name)}</div><div class="role">${esc(m.role)}${m.isOwner?'｜车队所有者':''}｜TMP ${esc(m.tmpId)}</div></div><div class="server"><strong>${esc(m.serverName)}</strong><span>服务器玩家编号 ${esc(m.serverPlayerId)}</span></div>`;list.appendChild(el)})}</script></body></html>
